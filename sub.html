<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>اشتراک سرویس اختصاصی | Nivexia</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --cyan: #38bdf8;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #090d16 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .user-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .status-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-item span {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 3px;
    }
    .stat-item strong {
      font-size: 0.98rem;
      color: var(--cyan);
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 32%;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      border-radius: 99px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .cfg-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 10px;
    }
    .cfg-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cfg-item.warning-item {
      background: rgba(245, 158, 11, 0.05);
      border-color: rgba(245, 158, 11, 0.3);
    }
    .cfg-title {
      font-size: 0.86rem;
      font-weight: 500;
    }
    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      font-size: 0.85rem;
    }
    .copy-btn:hover {
      color: var(--cyan);
    }

    #qr-wrapper {
      display: flex;
      justify-content: center;
      padding: 12px;
      background: #fff;
      border-radius: 14px;
      width: fit-content;
      margin: 12px auto;
    }

    .footer {
      text-align: center;
      margin-top: auto;
      padding: 24px 0 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: bold;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 0.82rem;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- کارت اطلاعات کاربر -->
    <div class="card">
      <div class="header-box">
        <div class="user-name" id="user-display">کاربر سرویس</div>
        <div class="status-badge">فعال</div>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <span>حجم باقیمانده</span>
          <strong id="remain-traffic">۴۱.۲ GB</strong>
        </div>
        <div class="stat-item">
          <span>اعتبار زمانی</span>
          <strong id="remain-days">۲۷ روز</strong>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted);">
        <span>مصرف شده: ۸.۸ GB</span>
        <span>کل سقف: ۵۰ GB</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- دکمه‌های اتصال سریع -->
    <div class="card">
      <button class="btn btn-primary" onclick="copyAllConfigs()">
        📋 کپی همه کانفیگ‌ها
      </button>
      <a id="btn-v2ray" class="btn btn-outline" href="#">
        ⚡ افزودن به v2rayNG با یک کلیک
      </a>
      <a id="btn-hiddify" class="btn btn-outline" href="#">
        🚀 افزودن به Hiddify با یک کلیک
      </a>
    </div>

    <!-- کیوآرکد سابسکریپشن -->
    <div class="card" style="text-align: center;">
      <span style="font-size: 0.8rem; color: var(--text-muted);">اسکن لینک اشتراک:</span>
      <div id="qr-wrapper"></div>
    </div>

    <!-- لیست کانفیگ‌ها -->
    <div class="card">
      <span style="font-size: 0.82rem; color: var(--text-muted);">کانفیگ‌های فعال شما:</span>
      <div class="cfg-list" id="config-list-box"></div>
    </div>

  </div>

  <!-- فوتر با هویت Nivexia -->
  <footer class="footer">
    طراحی و بهینه‌سازی شده توسط <a href="https://t.me/Nivexia" target="_blank">@Nivexia</a>
  </footer>

  <div id="toast">کپی شد!</div>

  <script>
    const subUrl = window.location.href;
    const host = window.location.hostname;
    
    // استخراج UUID از آدرس یا مقدار پیش‌فرض
    const urlParams = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const userUuid = urlParams.get('token') || pathParts[pathParts.length - 1] || 'a1b2c3d4-e5f6-7890-abcd-ef1234567890';
    const wsPath = encodeURIComponent('/stream/' + userUuid + '?ed=2560');

    // ۵ کانفیگ دقیق درخواستی شما
    const configs = [
      {
        name: "💎 𝗗𝗶𝗮𝗺𝗼𝗻𝗱",
        url: `vless://${userUuid}@${host}:443?encryption=none&security=tls&type=ws&host=${host}&path=${wsPath}&fp=chrome&sni=${host}#%F0%9F%92%8E%20%F0%9D%97%97%F0%9D%97%B6%F0%9D%97%AE%F0%9D%97%BA%F0%9D%97%BC%F0%9D%97%BD%F0%9D%97%B1`
      },
      {
        name: "🇳🇱 𝐀𝐦𝐬𝐭𝐞𝐫𝐝𝐚𝐦",
        url: `vless://${userUuid}@${host}:443?encryption=none&security=tls&type=ws&host=${host}&path=${wsPath}&fp=firefox&sni=${host}#%F0%9F%87%B3%F0%9F%87%B1%20%F0%9D%90%80%F0%9D%90%A6%F0%9D%90%AC%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%9D%F0%9D%90%9A%F0%9D%90%A4`
      },
      {
        name: "ویژه نت ملی 📣",
        url: `vless://${userUuid}@${host}:443?encryption=none&security=tls&type=ws&host=${host}&path=${wsPath}&alpn=http%2F1.1&fp=safari&sni=${host}#%D9%88%DB%8C%DA%98%D9%87%20%D9%86%D8%AA%20%D9%85%D9%84%DB%8C%20%F0%9F%93%A3`
      },
      {
        name: "🇳🇱 𝐀𝐦𝐬𝐭𝐞𝐫𝐝𝐚𝐦 𝟐",
        url: `vless://${userUuid}@${host}:443?encryption=none&security=tls&type=ws&host=${host}&path=${wsPath}&fp=chrome&alpn=h2,http%2F1.1&sni=${host}#%F0%9F%87%B3%F0%9F%87%B1%20%F0%9D%90%80%F0%9D%90%A6%F0%9D%90%AC%F0%9D%90%AD%F0%9D%90%9E%F0%9D%90%AB%F0%9D%90%9D%F0%9D%90%9A%F0%9D%90%A4%20%F0%9D%9F%AE`
      },
      {
        name: "● ‼️ اگر قطع شدی، لینکت رو آپدیت کن ‼️",
        url: `vless://00000000-0000-0000-0000-000000000000@127.0.0.1:1080?encryption=none&security=none&type=tcp#%E2%97%8F%20%E2%80%BC%EF%B8%8F%20%D8%A7%DA%AF%D8%B1%20%D9%82%D8%B7%D8%B9%20%D8%B4%D8%AF%DB%8C%D8%8C%20%D9%84%DB%8C%D9%86%DA%A9%D8%AA%20%D8%B1%D9%88%20%D8%A2%D9%BE%D8%AF%DB%8C%D8%AA%20%DA%A9%D9%86%20%E2%80%BC%EF%B8%8F`,
        isNotice: true
      }
    ];

    // ساخت QR Code
    new QRCode(document.getElementById("qr-wrapper"), {
      text: subUrl,
      width: 140,
      height: 140
    });

    // ست کردن لینک‌های مستقیم کلاینت‌ها
    document.getElementById("btn-v2ray").href = "v2rayng://install-config?url=" + encodeURIComponent(subUrl);
    document.getElementById("btn-hiddify").href = "hiddify://install-sub?url=" + encodeURIComponent(subUrl);

    // قرار دادن کانفیگ‌ها در صفحه
    const listContainer = document.getElementById("config-list-box");
    configs.forEach(cfg => {
      const item = document.createElement("div");
      item.className = "cfg-item" + (cfg.isNotice ? " warning-item" : "");
      item.innerHTML = `
        <span class="cfg-title">${cfg.name}</span>
        <button class="copy-btn" onclick="copyText('${cfg.url}')">کپی</button>
      `;
      listContainer.appendChild(item);
    });

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2000);
    }

    function copyText(val) {
      navigator.clipboard.writeText(val).then(() => showToast("کانفیگ کپی شد!"));
    }

    function copyAllConfigs() {
      const allText = configs.map(c => c.url).join("\n");
      navigator.clipboard.writeText(allText).then(() => showToast("همه کانفیگ‌ها کپی شدند!"));
    }
  </script>
</body>
</html>
